[project]
name = "incident-assistant"
version = "0.1.0"
description = "Enterprise AI Incident Investigation Assistant"
readme = "../README.md"
requires-python = ">=3.12"

authors = [
    { name = "Shivam" }
]

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "ruff>=0.12.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"